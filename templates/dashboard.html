<!DOCTYPE html>
<html>

<head>

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


<style>

body{

    background:#f4f7fb;

}


.main{

    width:90%;

    margin:auto;

}


.card{

    border-radius:20px;

    box-shadow:0px 5px 15px #ccc;

    height:250px;

    display:flex;

    justify-content:center;

    align-items:center;

}


</style>


</head>


<body>


<div class="main mt-5">


<h1 class="text-center mb-5">

🩺 AI Disease Prediction Dashboard

</h1>



<div class="row g-4">



<div class="col-lg-4 col-md-6 col-sm-12">


<div class="card p-4 text-center">


<h2>🤖</h2>

<h4>Disease Prediction</h4>


<p>
Predict diseases using symptoms
</p>


<a href="/prediction" class="btn btn-primary">

Start Prediction

</a>


</div>

</div>





<div class="col-lg-4 col-md-6 col-sm-12">


<div class="card p-4 text-center">


<h2>📄</h2>


<h4>Medical Report</h4>


<p>
Generate AI PDF report
</p>


<a href="/download_report" class="btn btn-danger">

Download PDF

</a>


</div>

</div>






<div class="col-lg-4 col-md-6 col-sm-12">


<div class="card p-4 text-center">


<h2>🏥</h2>


<h4>Healthcare Support</h4>


<p>
Doctor recommendation
</p>


<a href="/contact" class="btn btn-success">

Contact

</a>


</div>

</div>






<div class="col-lg-4 col-md-6 col-sm-12">


<div class="card p-4 text-center">


<h2>🏥</h2>


<h4>Nearby Hospitals</h4>


<p>
Find hospitals near you
</p>


<a href="https://www.google.com/maps/search/hospitals"

target="_blank"

class="btn btn-success">

Find Hospital

</a>


</div>

</div>




</div>


</div>


</body>


</html>
