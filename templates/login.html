<!DOCTYPE html>
<html>

<head>

<title>AI Disease Prediction Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


<style>
    container{

    width:100%;
    max-width:1200px;

}


.row{

    display:flex;
    flex-wrap:wrap;
    justify-content:center;

}


.card{

    width:100%;
    height:250px;

}
html, body{

width:100%;
height:100%;
margin:0;
padding:0;
overflow-x:hidden;

}


body{

background:linear-gradient(135deg,#0d6efd,#20c997);

display:flex;

align-items:center;

justify-content:center;

}


.login-card{

background:white;

padding:35px;

border-radius:20px;

width:400px;

max-width:90%;

box-shadow:0px 5px 20px gray;

}


</style>

</head>


<body>


<div class="login-card">


<h2 class="text-center">

🩺 AI Health System

</h2>


<p class="text-center">

Login to continue

</p>




{% if error %}

<div class="alert alert-danger">

{{error}}

</div>

{% endif %}





<form method="POST">


<div class="mb-3">


<label>
Username
</label>


<input type="text"

name="username"

class="form-control"

placeholder="Enter Username">


</div>





<div class="mb-3">


<label>
Password
</label>


<input type="password"

name="password"

class="form-control"

placeholder="Enter Password">


</div>





<button class="btn btn-primary w-100">

Login

</button>



</form>


</div>



</body>


</html>
